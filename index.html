<title>Zoo English</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: one centred column; home = grid of green zoo-enclosure signs; each game = one big card stage */
:root{
  --bg:#eef2e3; --surface:#ffffff; --ink:#1e2b21; --muted:#5b685d; --line:#d3dcc7;
  --sign:#1d6a43; --sign-ink:#ffffff; --accent:#f0a31a; --accent-ink:#2a1a00;
  --tile:#fffbef; --good:#2c9a56; --good-soft:#d8f1e0; --bad:#d4483f; --bad-soft:#fbe0dc;
  --display:'Baloo 2','Trebuchet MS',system-ui,sans-serif;
  --body:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101c15; --surface:#18291f; --ink:#e8f0e3; --muted:#9db0a1; --line:#2b4335;
  --sign:#2a8456; --sign-ink:#ffffff; --accent:#f5b53c; --accent-ink:#2a1a00;
  --tile:#1f3428; --good:#4cc47c; --good-soft:#1d4430; --bad:#ff7b70; --bad-soft:#4a2421; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101c15; --surface:#18291f; --ink:#e8f0e3; --muted:#9db0a1; --line:#2b4335;
  --sign:#2a8456; --sign-ink:#ffffff; --accent:#f5b53c; --accent-ink:#2a1a00;
  --tile:#1f3428; --good:#4cc47c; --good-soft:#1d4430; --bad:#ff7b70; --bad-soft:#4a2421; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.1;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand .logo{font-size:40px;line-height:1}
.brand h1{font-size:34px;font-weight:800;color:var(--sign)}
.brand p{margin:0;color:var(--muted);font-size:15px}
.total{background:var(--accent);color:var(--accent-ink);font-family:var(--display);font-weight:800;font-size:20px;padding:4px 14px;border-radius:999px;font-variant-numeric:tabular-nums}

/* Home: zoo signs */
.intro{margin:0;color:var(--muted)}
.signs{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.sign{background:var(--sign);color:var(--sign-ink);border:0;border-radius:12px;padding:16px;text-align:left;
  box-shadow:inset 0 0 0 3px rgba(255,255,255,.85),inset 0 0 0 6px var(--sign),0 4px 0 rgba(0,0,0,.18);
  display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:center;transition:transform .12s}
.sign:hover{transform:translateY(-2px)}
.sign:active{transform:translateY(1px)}
.sign .ico{font-size:40px;grid-row:span 2;line-height:1}
.sign .t{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:.02em;text-transform:uppercase;line-height:1.1}
.sign .s{font-size:14px;opacity:.9;line-height:1.3}
.sign .st{grid-column:1/-1;font-size:18px;letter-spacing:2px;margin-top:6px}

/* Game */
.bar{display:flex;align-items:center;gap:12px}
.back{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:700}
.bar h2{font-size:24px;flex:1;min-width:0}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dot{width:12px;height:12px;border-radius:50%;background:var(--line)}
.dot.ok{background:var(--good)} .dot.no{background:var(--accent)} .dot.now{box-shadow:0 0 0 3px var(--accent)}
.stage{background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:24px 20px;display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center}
.pic{font-size:96px;line-height:1.1}
.q{font-family:var(--display);font-size:28px;font-weight:600;line-height:1.25;max-width:30ch}
.gap{display:inline-block;min-width:3.5em;border-bottom:3px dashed var(--accent);color:var(--sign);padding:0 4px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;width:100%}
.opt{background:var(--tile);border:2px solid var(--line);border-radius:14px;padding:14px 10px;font-size:21px;font-weight:700;transition:transform .1s}
.opt:hover{border-color:var(--sign)}
.opt.right{background:var(--good-soft);border-color:var(--good);color:var(--ink)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad);opacity:.75}
.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.pop{animation:pop .35s}
@keyframes pop{50%{transform:scale(1.12)}}
.say{border:0;background:none;font-size:24px;padding:2px 6px;border-radius:8px;vertical-align:middle}
.say:hover{background:var(--tile)}
.fb{min-height:1.6em;font-weight:700;font-size:19px}
.fb.good{color:var(--good)} .fb.bad{color:var(--bad)}
.next{background:var(--sign);color:var(--sign-ink);border:0;border-radius:999px;padding:12px 30px;font-family:var(--display);font-weight:800;font-size:22px;box-shadow:0 4px 0 rgba(0,0,0,.2)}
.next:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.2)}
.small{font-size:15px;color:var(--muted);margin:0}

/* Spelling + sentence tiles */
.slots,.pool{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:58px;width:100%}
.slots{border-bottom:3px dashed var(--line);padding-bottom:10px}
.tile{background:var(--tile);border:2px solid var(--line);border-radius:12px;padding:8px 14px;font-size:22px;font-weight:700;min-width:48px}
.tile.used{visibility:hidden}
.slot{width:46px;height:52px;border-radius:10px;background:var(--tile);border:2px solid var(--line);display:grid;place-items:center;font-size:26px;font-weight:700;text-transform:lowercase}
.slot.filled{border-color:var(--sign)}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.ghost{background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:8px 18px;font-weight:700}

/* Picture hunt */
.scene{position:relative;width:100%;border-radius:14px;overflow:hidden;cursor:crosshair;touch-action:manipulation}
.scene img{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none}
.mark{position:absolute;width:13%;aspect-ratio:1;border-radius:50%;border:4px solid #fff;box-shadow:0 0 0 3px var(--good);transform:translate(-50%,-50%);pointer-events:none}
.mark.miss{box-shadow:0 0 0 3px var(--bad);width:8%;animation:fade 1s forwards}
@keyframes fade{to{opacity:0}}
.card{background:var(--tile);border:2px solid var(--good);border-radius:14px;padding:12px 16px;font-size:20px;text-align:left;width:100%}
.card p{margin:2px 0}

/* My animal */
.animals{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:100%}
.animals .opt{font-size:15px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px}
.animals .opt span{font-size:44px;line-height:1.1}
.story{width:100%;text-align:left;background:var(--tile);border-radius:14px;padding:12px 16px;border:2px solid var(--line);font-size:19px}
.story ol{margin:0;padding-left:1.4em}
.story li{margin:2px 0}
.story b{color:var(--sign)}

/* Reading */
.text{font-size:26px;line-height:1.75;text-align:left;max-width:34ch;width:100%;background:var(--tile);border:2px solid var(--line);border-radius:14px;padding:14px 18px}
.text.small-text{font-size:19px;line-height:1.6;max-width:none}
.w{cursor:pointer;border-radius:6px;padding:0 1px;transition:background .15s}
.w:hover{background:var(--good-soft)}
.w.hl,.w.hl1{background:var(--accent);color:var(--accent-ink)}
.w.hl1{animation:unhl 1s forwards}
@keyframes unhl{to{background:transparent;color:inherit}}
.qbox{display:flex;flex-direction:column;align-items:center;gap:12px;width:100%}
.end .big{font-size:60px;letter-spacing:6px}
@media (max-width:520px){
  .pic{font-size:80px}.q{font-size:24px}.opt{font-size:19px}
  .animals{grid-template-columns:repeat(4,1fr)}.animals .opt span{font-size:34px}.animals .opt{font-size:12px}
  .slot{width:38px;height:46px;font-size:22px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

/* ---------- helpers ---------- */
const app = document.getElementById("app");
const shuffle = a => { a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]} return a; };
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
/* "live"/"lives" are always the verb here (/lɪv/, /lɪvz/), never "live music" or the plural of "life".
   The extra space keeps the text length, so word highlighting stays in place. */
const fixSay = t => t.replace(/\b([Ll])ive(s?)\b/g,"$1iv$2 ");
function speak(t){ try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(fixSay(t)); u.lang="en-GB"; u.rate=.85; speechSynthesis.speak(u);}catch(e){} }
let actx=null;
function beep(ok){ try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)(); const o=actx.createOscillator(),g=actx.createGain();
  o.type="sine"; const t=actx.currentTime; o.frequency.setValueAtTime(ok?660:220,t); if(ok)o.frequency.setValueAtTime(880,t+.09);
  g.gain.setValueAtTime(.12,t); g.gain.exponentialRampToValueAtTime(.001,t+.3); o.connect(g).connect(actx.destination); o.start(t); o.stop(t+.32);}catch(e){} }
function getBest(){ try{return JSON.parse(localStorage.getItem("zooBest")||"{}")}catch(e){return {}} }
function setBest(id,n){ const b=getBest(); if(!(b[id]>=n)){b[id]=n; try{localStorage.setItem("zooBest",JSON.stringify(b))}catch(e){}} }
const starStr = n => "★".repeat(n)+"☆".repeat(3-n);
const sayBtn = t => `<button class="say" data-say="${esc(t)}" aria-label="Listen">🔊</button>`;
app.addEventListener("click",e=>{const b=e.target.closest("[data-say]"); if(b) speak(b.dataset.say);});
function flash(el,cls){ el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }

/* ---------- home ---------- */
function home(){
  const best=getBest(); const total=GAMES.reduce((s,g)=>s+(best[g.id]||0),0);
  app.innerHTML = `
  <header>
    <div class="brand"><div class="logo">🦓</div><div><h1>Zoo English</h1><p>Topic 1 · The zoo</p></div></div>
    <div class="total" title="Stars collected">★ ${total} / ${GAMES.length*3}</div>
  </header>
  <p class="intro">Choose a game. Get 3 stars in every game! Press 🔊 to hear the words.</p>
  <div class="signs">${GAMES.map(g=>`
    <button class="sign" data-go="${g.id}"><span class="ico">${g.ico}</span><span class="t">${g.t}</span><span class="s">${g.s}</span>
    <span class="st" aria-label="${best[g.id]||0} stars">${starStr(best[g.id]||0)}</span></button>`).join("")}
  </div>`;
  app.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>start(b.dataset.go));
}

/* ---------- game shell ---------- */
let G=null;
function start(id){
  const game=GAMES.find(g=>g.id===id);
  let items;
  if(id==="words") items=shuffle(WORDS).slice(0,10).map(([e,w])=>({pic:e,q:"What is it?",opts:shuffle([w,...shuffle(WORDS.filter(x=>x[1]!==w)).slice(0,3).map(x=>x[1])]),a:w,say:w}));
  if(id==="spell") items=shuffle(SPELL).slice(0,8).map(w=>({w,pic:(WORDS.find(x=>x[1]===w)||WORDS.find(x=>x[1].startsWith(w)))[0]}));
  if(id==="grammar") items=shuffle(GRAMMAR).slice(0,12).map(([pic,q,opts,a])=>({pic,q,opts,a,say:q.replace("___",a).replace(/ [😋🤢]/u,"")}));
  if(id==="build") items=shuffle(SENTENCES).slice(0,8).map(s=>({s}));
  if(id==="hunt") items=shuffle(HUNT);
  if(id==="read") items=shuffle(READING).slice(0,3);
  if(id==="mine") items=[null];
  G={id,game,items,i:0,score:0,res:[]};
  if(id==="read") G.total=items.reduce((s,t)=>s+t.qs.length,0);
  if(id==="mine") return mine();
  step();
}
function shell(inner){
  const dots=G.items.length>1?`<div class="dots" aria-hidden="true">${G.items.map((_,k)=>`<span class="dot ${G.res[k]===true?"ok":G.res[k]===false?"no":""} ${k===G.i?"now":""}"></span>`).join("")}</div>`:"";
  app.innerHTML=`<div class="bar"><button class="back" id="back">← Back</button><h2>${G.game.ico} ${G.game.t}</h2></div>${dots}<div class="stage" id="stage">${inner}</div>`;
  document.getElementById("back").onclick=()=>{try{speechSynthesis.cancel()}catch(e){} home();};
  return document.getElementById("stage");
}
function record(firstTry){ if(G.res[G.i]===undefined){G.res[G.i]=firstTry; if(firstTry)G.score++;} }
function nextBtn(stage){
  const b=document.createElement("button"); b.className="next"; b.textContent=G.i<G.items.length-1?"Next →":"Finish ★";
  b.onclick=()=>{G.i++; G.i<G.items.length?step():finish();}; stage.appendChild(b); b.focus();
}
function step(){ ({words:choice,grammar:choice,spell,build,hunt,read:reading})[G.id](G.items[G.i]); }
function finish(){
  const total=G.total||G.items.length;
  const pct=G.score/total, stars=pct>=.9?3:pct>=.7?2:1; setBest(G.id,stars);
  const msg=stars===3?"Excellent! 🎉":stars===2?"Very good! 👍":"Good try! Play again 💪";
  const st=shell(`<div class="end"><div class="big" style="color:var(--accent)">${starStr(stars)}</div></div>
    <h3 style="font-size:32px">${msg}</h3><p class="small">${G.score} of ${total} right on the first try</p>
    <div class="row"><button class="next" id="again">Play again</button><button class="ghost" id="menu">All games</button></div>`);
  speak(msg.replace(/[^\w! ]/g,""));
  st.querySelector("#again").onclick=()=>start(G.id); st.querySelector("#menu").onclick=home;
}

/* ---------- choice (words + grammar) ---------- */
function choice(it){
  const qhtml=esc(it.q).replace("___",'<span class="gap" id="gap">&nbsp;</span>');
  const st=shell(`<div class="pic">${it.pic}</div><div class="q">${qhtml}</div>
    <div class="opts">${it.opts.map(o=>`<button class="opt">${esc(o)}</button>`).join("")}</div><div class="fb" id="fb"></div>`);
  let missed=false, done=false;
  st.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    if(done||b.classList.contains("wrong")) return;
    const fb=st.querySelector("#fb");
    if(b.textContent===it.a){
      done=true; record(!missed); b.classList.add("right"); flash(b,"pop"); beep(true);
      const g=st.querySelector("#gap"); if(g) g.textContent=it.a;
      fb.className="fb good"; fb.innerHTML=`Yes! ${esc(it.say)} ${sayBtn(it.say)}`; speak(it.say); nextBtn(st);
    } else {
      missed=true; b.classList.add("wrong"); flash(b,"shake"); beep(false);
      fb.className="fb bad"; fb.textContent="Not this one. Try again!";
    }
  });
}

/* ---------- spelling ---------- */
function spell(it){
  const letters=shuffle(it.w.split("").map((c,k)=>({c,k})));
  const st=shell(`<div class="pic">${it.pic}</div><div class="q">Spell the word ${sayBtn(it.w)}</div>
    <div class="slots" id="slots">${it.w.split("").map(()=>`<div class="slot"></div>`).join("")}</div>
    <div class="pool" id="pool">${letters.map((l,n)=>`<button class="tile" data-n="${n}">${l.c}</button>`).join("")}</div>
    <div class="row"><button class="ghost" id="undo">⌫ Undo</button><button class="ghost" id="hint">💡 Hint</button></div><div class="fb" id="fb"></div>`);
  let typed=[], missed=false, done=false;
  const slots=[...st.querySelectorAll(".slot")], tiles=[...st.querySelectorAll(".tile")], fb=st.querySelector("#fb");
  const paint=()=>slots.forEach((s,k)=>{s.textContent=typed[k]!=null?letters[typed[k]].c:""; s.classList.toggle("filled",typed[k]!=null);});
  tiles.forEach(t=>t.onclick=()=>{
    if(done) return; typed.push(+t.dataset.n); t.classList.add("used"); paint();
    if(typed.length===it.w.length){
      const word=typed.map(n=>letters[n].c).join("");
      if(word===it.w){done=true;record(!missed);beep(true);flash(st.querySelector("#slots"),"pop");fb.className="fb good";fb.innerHTML=`Great! ${it.w} ${sayBtn(it.w)}`;speak(it.w);nextBtn(st);}
      else{missed=true;beep(false);flash(st.querySelector("#slots"),"shake");fb.className="fb bad";fb.textContent="Oops! Try again.";
        setTimeout(()=>{typed=[];tiles.forEach(x=>x.classList.remove("used"));paint();},600);}
    }
  });
  st.querySelector("#undo").onclick=()=>{ if(done||!typed.length) return; const n=typed.pop(); tiles[n].classList.remove("used"); paint(); };
  st.querySelector("#hint").onclick=()=>{ if(done) return; missed=true; fb.className="fb"; fb.textContent=`It starts with “${it.w[0]}”`; speak(it.w); };
}

/* ---------- sentence builder ---------- */
function build(it){
  const words=it.s.replace(/\.$/,"").split(" ");
  let order=shuffle(words.map((w,k)=>k)); if(words.length>1 && order.every((v,k)=>v===k)) order=order.reverse();
  const st=shell(`<div class="q">Make the sentence</div>
    <div class="slots" id="slots"></div>
    <div class="pool" id="pool">${order.map(k=>`<button class="tile" data-k="${k}">${esc(words[k])}</button>`).join("")}</div>
    <div class="row"><button class="ghost" id="undo">⌫ Undo</button><button class="ghost" id="listen">🔊 Listen</button></div><div class="fb" id="fb"></div>`);
  let chosen=[], missed=false, done=false;
  const slots=st.querySelector("#slots"), tiles=[...st.querySelectorAll(".tile")], fb=st.querySelector("#fb");
  const paint=()=>{slots.innerHTML=chosen.map(k=>`<span class="tile">${esc(words[k])}</span>`).join("")+(chosen.length===words.length?'<span class="tile" style="border:0;background:none;min-width:0">.</span>':"");};
  tiles.forEach(t=>t.onclick=()=>{
    if(done) return; chosen.push(+t.dataset.k); t.classList.add("used"); paint();
    if(chosen.length===words.length){
      const made=chosen.map(k=>words[k]).join(" ");
      if(made===words.join(" ")){done=true;record(!missed);beep(true);flash(slots,"pop");fb.className="fb good";fb.innerHTML=`Super! ${sayBtn(it.s)}`;speak(it.s);nextBtn(st);}
      else{missed=true;beep(false);flash(slots,"shake");fb.className="fb bad";fb.textContent="Almost! Try again.";
        setTimeout(()=>{chosen=[];tiles.forEach(x=>x.classList.remove("used"));paint();},700);}
    }
  });
  st.querySelector("#undo").onclick=()=>{ if(done||!chosen.length) return; const k=chosen.pop(); tiles.find(t=>+t.dataset.k===k).classList.remove("used"); paint(); };
  st.querySelector("#listen").onclick=()=>{ if(!done) missed=true; speak(it.s); };
}

/* ---------- zoo hunt ---------- */
function hunt(it){
  const label=it.label||it.k;
  const st=shell(`<div class="q">Find the <span style="color:var(--sign)">${esc(label)}</span>! ${sayBtn("Find the "+label)}</div>
    <div class="scene" id="scene"><img src="${ZOO_IMG}" alt="A big zoo with many animals"></div><div class="fb" id="fb">Tap on the picture.</div>`);
  const scene=st.querySelector("#scene"), fb=st.querySelector("#fb"); let missed=false, done=false;
  scene.onclick=e=>{
    if(done) return;
    const r=scene.getBoundingClientRect(), x=(e.clientX-r.left)/r.width*100, y=(e.clientY-r.top)/r.height*100;
    let best=null,bd=1e9; HUNT.forEach(h=>{const d=Math.hypot(h.x-x,(h.y-y)*.55); if(d<bd){bd=d;best=h;}});
    if(bd<9 && best.k===it.k){
      done=true; record(!missed); beep(true);
      scene.insertAdjacentHTML("beforeend",`<div class="mark" style="left:${it.x}%;top:${it.y}%"></div>`);
      const txt=it.lines.join(" ");
      fb.className="fb good"; fb.textContent="You found it!";
      fb.insertAdjacentHTML("afterend",`<div class="card">${it.lines.map(l=>`<p>${esc(l)}</p>`).join("")}<p>${sayBtn(txt)}</p></div>`);
      speak(txt); nextBtn(st);
    } else {
      missed=true; beep(false);
      scene.insertAdjacentHTML("beforeend",`<div class="mark miss" style="left:${x}%;top:${y}%"></div>`);
      fb.className="fb bad";
      if(bd<9){ const n=best.label?"These are zebras":"This is a "+best.k; fb.textContent=`No. ${n}. Find the ${label}!`; speak(n); }
      else fb.textContent="Not here. Look again!";
    }
  };
}

/* ---------- reading ---------- */
function textHTML(t){
  let html="",pos=0;
  t.split(/(\s+)/).forEach(tok=>{
    if(tok && !/^\s+$/.test(tok)) html+=`<span class="w" data-i="${pos}" data-word="${esc(tok.replace(/[.,!?]/g,""))}">${esc(tok)}</span>`;
    else html+=tok;
    pos+=tok.length;
  });
  return html;
}
function readAloud(t,box){
  try{
    speechSynthesis.cancel();
    const spans=[...box.querySelectorAll(".w")], clear=()=>spans.forEach(s=>s.classList.remove("hl"));
    const u=new SpeechSynthesisUtterance(fixSay(t)); u.lang="en-GB"; u.rate=.75;
    u.onboundary=e=>{ let cur=null; spans.forEach(s=>{ if(+s.dataset.i<=e.charIndex) cur=s; }); spans.forEach(s=>s.classList.toggle("hl",s===cur)); };
    u.onend=clear; u.onerror=clear; speechSynthesis.speak(u);
  }catch(e){}
}
function wireWords(box){
  box.addEventListener("click",e=>{ const w=e.target.closest(".w"); if(!w) return; speak(w.dataset.word); flash(w,"hl1"); });
}
function reading(it){
  let qi=-1, allFirst=true;
  const draw=()=>{
    const reading=qi<0, q=it.qs[qi];
    const st=shell(`<div class="pic" style="font-size:${reading?72:48}px">${it.e}</div>
      <div class="text ${reading?"":"small-text"}" id="txt">${textHTML(it.text)}</div>
      ${reading?`<p class="small">Read the text aloud. Tap a word to hear it.</p>
        <div class="row"><button class="ghost" id="aloud">🔊 Read to me</button><button class="next" id="go">I read it! →</button></div>`
      :`<div class="qbox"><div class="small">Question ${qi+1} of ${it.qs.length}</div>
        <div class="q">${esc(q.q)} ${sayBtn(q.q)}</div>
        <div class="opts">${q.opts.map(o=>`<button class="opt">${esc(o)}</button>`).join("")}</div><div class="fb" id="fb"></div></div>`}`);
    const box=st.querySelector("#txt"); wireWords(box);
    if(reading){
      st.querySelector("#aloud").onclick=()=>readAloud(it.text,box);
      st.querySelector("#go").onclick=()=>{ try{speechSynthesis.cancel()}catch(e){} qi=0; draw(); };
      return;
    }
    let missed=false, done=false; const fb=st.querySelector("#fb");
    st.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
      if(done||b.classList.contains("wrong")) return;
      if(b.textContent===q.a){
        done=true; beep(true); b.classList.add("right"); flash(b,"pop");
        if(!missed) G.score++; else allFirst=false;
        fb.className="fb good"; fb.textContent="Yes! 👍"; speak(q.a);
        if(qi<it.qs.length-1){ setTimeout(()=>{qi++; draw();},1100); }
        else { G.res[G.i]=allFirst; nextBtn(st); }
      } else {
        missed=true; beep(false); b.classList.add("wrong"); flash(b,"shake");
        fb.className="fb bad"; fb.textContent="Look at the text again!";
      }
    });
  };
  draw();
}

/* ---------- my favorite animal ---------- */
function mine(){
  G.items=[null]; G.mistakes=0;
  const st=shell(`<div class="q">What is your favorite animal?</div>
    <div class="animals">${Object.values(ANIMALS).map(a=>`<button class="opt" data-a="${esc(a.name)}"><span>${a.e}</span>${esc(a.name)}</button>`).join("")}</div>
    <p class="small">Choose an animal. Then make 7 sentences about it.</p>`);
  st.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>mineSteps(ANIMALS[b.dataset.a]));
}
function mineSteps(A){
  const all=Object.values(A===null?{}:ANIMALS);
  const pick=(field,n=2)=>shuffle([...new Set(all.map(x=>x[field]).filter(v=>v!==A[field]))]).slice(0,n);
  const art=/^[aeiou]/.test(A.name)?"an":"a";
  const likeTurn=Math.random()<.5, hasTurn=Math.random()<.5, canTurn=Math.random()<.5;
  const steps=[
    {q:`My favorite animal is ___ ${A.name}.`,opts:["a","an"],a:art},
    {q:`It lives ___.`,opts:shuffle([A.place,...pick("place")]),a:A.place},
    {q:`It eats ___.`,opts:shuffle([A.eats,...pick("eats")]),a:A.eats},
    likeTurn?{q:`It ___ ${A.like}.`,opts:["likes","doesn't like"],a:"likes"}:{q:`It ___ ${A.dislike}.`,opts:["likes","doesn't like"],a:"doesn't like"},
    hasTurn?{q:`It ___ ${A.has}.`,opts:["has got","hasn't got"],a:"has got"}:{q:`It ___ ${A.hasnt}.`,opts:["has got","hasn't got"],a:"hasn't got"},
    canTurn?{q:`It ___ ${A.can}.`,opts:["can","can't"],a:"can"}:{q:`It ___ ${A.cant}.`,opts:["can","can't"],a:"can't"},
    {q:`This is ___ ${A.adj} ${A.name}.`,opts:art==="a"?["a","an"]:["an","a"],a:art}
  ];
  // last step: article depends on adjective
  steps[6].a=/^[aeiou]/.test(A.adj)?"an":"a"; steps[6].opts=["a","an"];
  const story=[]; let k=0;
  const draw=()=>{
    const s=steps[k];
    const st=shell(`<div class="pic">${A.e}</div>
      <div class="q">${esc(s.q).replace("___",'<span class="gap" id="gap">&nbsp;</span>')}</div>
      <div class="opts">${s.opts.map(o=>`<button class="opt">${esc(o)}</button>`).join("")}</div><div class="fb" id="fb">Sentence ${k+1} of 7</div>
      ${story.length?`<div class="story"><ol>${story.map(l=>`<li>${esc(l)}</li>`).join("")}</ol></div>`:""}`);
    let done=false;
    st.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
      if(done||b.classList.contains("wrong")) return;
      if(b.textContent===s.a){
        done=true; beep(true); b.classList.add("right"); st.querySelector("#gap").textContent=s.a;
        const line=s.q.replace("___",s.a); story.push(line); speak(line);
        setTimeout(()=>{k++; k<steps.length?draw():mineEnd(A,story);},1100);
      } else { G.mistakes++; beep(false); b.classList.add("wrong"); flash(b,"shake"); st.querySelector("#fb").textContent="Hmm… try the other one!"; }
    });
  };
  draw();
}
function mineEnd(A,story){
  const stars=G.mistakes===0?3:G.mistakes<=2?2:1; setBest("mine",stars);
  const text=story.join(" ");
  const st=shell(`<div class="pic">${A.e}</div><div style="font-size:44px;letter-spacing:6px;color:var(--accent)">${starStr(stars)}</div>
    <h3 style="font-size:28px">My favorite animal</h3>
    <div class="story"><ol>${story.map(l=>`<li>${esc(l)}</li>`).join("")}</ol></div>
    <p class="small">Read it aloud. Can you say it without looking?</p>
    <div class="row"><button class="next" data-say="${esc(text)}">🔊 Listen</button><button class="ghost" id="again">Another animal</button><button class="ghost" id="menu">All games</button></div>`);
  st.querySelector("#again").onclick=()=>start("mine"); st.querySelector("#menu").onclick=home;
}

home();
</script>
